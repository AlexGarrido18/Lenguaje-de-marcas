<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores en CSS</title>

</head>

<body>

    <!-- selecciones con identificador-->
    <p>
        Este párrafo se selecciona con el selector #id
    </p>


    <!-- seleccionando elementos con clase -->
    <h1>Normal</h1>
    <h1 >Especial</h1>
    <h1>Normal</h1>
    <h1 >Especial</h1>

    <!--selección de varios elementos-->
    <h2>Varios elementos</h2>
    <h3>Varios elementos</h3>
  
    <!-- dentro de otro -->
    <ul>
        <li>Primero</li>
        <li>Segundo
            <ul>
                <li>2.1</li>
                <li>2.2</li>
            </ul>
        </li>
    </ul>
  
    <p>
        <img width="100" src="img/openwebinars-logo.jpg" alt="primera">
        <span><img width="100" src="img/openwebinars-logo.jpg" alt="segunda"></span>
    </p>

    <h3>Después y menor (contiguo o no)</h3>
 
    <h3>Hermanos menores (contiguo o no)</h3>

</body>

</html>
